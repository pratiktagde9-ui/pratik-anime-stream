<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pratik Anime Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0303;
    --bg-soft:#140505;
    --card:#1a0808;
    --accent:#e21f2b;
    --accent2:#ff4d4d;
    --accent-glow:rgba(226,31,43,0.45);
    --cyan:#e21f2b;
    --text:#f5f2f2;
    --text-dim:#a89898;
    --border:#2a1414;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Poppins',sans-serif;
    padding-bottom:78px;
    -webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none;color:inherit;}
  img{display:block;}

  /* ---------- HEADER / HERO ---------- */
  .hero{
    position:relative;
    min-height:640px;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(226,31,43,0.35), transparent 60%),
      linear-gradient(180deg,#1a0505 0%, #150404 30%, #0f0303 60%, var(--bg) 100%);
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(2px 2px at 20% 20%, rgba(255,255,255,0.45), transparent),
      radial-gradient(2px 2px at 70% 15%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 40% 30%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 85% 40%, rgba(255,255,255,0.25), transparent),
      radial-gradient(2px 2px at 55% 10%, rgba(255,255,255,0.35), transparent);
    opacity:0.8;
    pointer-events:none;
  }
  .hero::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:55%;
    background:linear-gradient(0deg, var(--bg) 5%, transparent 100%);
    pointer-events:none;
  }
  .hero-slash{
    position:absolute; top:0; left:0;
    width:220px; height:220px;
    background:linear-gradient(135deg, var(--accent) 0%, transparent 70%);
    clip-path:polygon(0 0, 100% 0, 0 100%);
    opacity:0.55;
    z-index:1;
  }
  .hero-slash.right{
    left:auto; right:0;
    background:linear-gradient(-135deg, var(--accent) 0%, transparent 70%);
    clip-path:polygon(100% 0, 100% 100%, 0 0);
  }

  .topbar{
    position:relative; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 20px 0;
  }
  .brand{
    display:flex; flex-direction:column; line-height:0.85;
  }
  .brand .name{
    font-family:'Bebas Neue',sans-serif;
    font-size:30px;
    letter-spacing:1px;
    color:#fff;
    text-shadow:0 0 18px rgba(255,255,255,0.25);
  }
  .brand .tag{
    font-family:'Bebas Neue',sans-serif;
    font-size:15px;
    color:var(--accent);
    letter-spacing:2px;
    margin-top:2px;
    text-shadow:0 0 12px var(--accent-glow);
  }
  .brand .jp{
    font-size:9px;
    color:var(--text-dim);
    letter-spacing:3px;
    margin-top:3px;
  }
  .icon-group{display:flex; gap:18px; align-items:center;}
  .icon-btn{
    width:22px;height:22px;
    color:#fff;
    opacity:0.9;
    cursor:pointer;
  }

  .welcome-badge{
    position:relative; z-index:5;
    display:inline-flex; align-items:center; gap:8px;
    margin:26px 0 0 20px;
    background:var(--accent);
    color:#fff;
    font-family:'Bebas Neue',sans-serif;
    font-size:13px;
    letter-spacing:2px;
    padding:7px 14px;
    clip-path:polygon(0 0, 100% 0, 94% 100%, 0% 100%);
  }
  .hero-title{
    position:relative; z-index:5;
    margin:14px 20px 0;
    font-family:'Bebas Neue',sans-serif;
    line-height:0.95;
  }
  .hero-title .l1{
    display:block;
    font-size:44px;
    color:#fff;
    letter-spacing:1px;
    text-shadow:0 4px 20px rgba(0,0,0,0.6);
  }
  .hero-title .l2{
    display:block;
    font-size:44px;
    color:var(--accent2);
    letter-spacing:1px;
    text-shadow:0 0 24px var(--accent-glow);
  }
  .hero-sub{
    position:relative; z-index:5;
    margin:10px 20px 0;
    font-size:13.5px;
    color:var(--text-dim);
  }
  .feature-row{
    position:relative; z-index:5;
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin:18px 20px 0;
  }
  .feature-item{
    display:flex; align-items:center; gap:8px;
  }
  .feature-icon{
    width:30px; height:30px;
    border-radius:50%;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .feature-icon svg{width:15px;height:15px;color:#fff;}
  .feature-text .ft-title{font-size:11px; font-weight:700; color:#fff; letter-spacing:0.3px;}
  .feature-text .ft-sub{font-size:10px; color:var(--text-dim);}

  .cta-btn{
    position:relative; z-index:5;
    display:inline-flex; align-items:center; gap:10px;
    margin:22px 0 0 20px;
    background:var(--accent);
    color:#fff;
    font-family:'Bebas Neue',sans-serif;
    font-size:15px;
    letter-spacing:1.5px;
    padding:13px 24px;
    border-radius:8px;
    box-shadow:0 8px 22px var(--accent-glow);
  }
  .cta-icon{
    width:22px;height:22px;
    background:#fff;
    color:var(--accent);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .cta-icon svg{width:11px;height:11px;}

  .search-wrap{
    position:relative; z-index:5;
    margin:22px 20px 0;
  }
  .search-box{
    display:flex; align-items:center;
    background:rgba(15,15,22,0.55);
    border:1px solid rgba(255,255,255,0.18);
    backdrop-filter:blur(6px);
    border-radius:999px;
    padding:14px 20px;
  }
  .search-box input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:#fff;
    font-size:15px;
    font-family:'Poppins',sans-serif;
  }
  .search-box input::placeholder{color:rgba(255,255,255,0.55);}
  .search-box svg{width:18px;height:18px;color:#fff;opacity:0.85;flex-shrink:0;}

  .hero-figures{
    position:absolute;
    right:0; top:0; bottom:0;
    width:46%;
    z-index:2;
    opacity:0.9;
    pointer-events:none;
  }
  .hero-figures svg{
    width:100%; height:100%;
  }

  .categories{
    position:relative; z-index:5;
    display:flex;
    gap:14px;
    padding:18px 20px 0;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .categories::-webkit-scrollbar{display:none;}
  .cat-card{
    flex:0 0 auto;
    width:135px;
    text-align:center;
  }
  .cat-poster{
    width:135px; height:150px;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 24px rgba(0,0,0,0.45);
  }
  .cat-poster svg{width:64px;height:64px;position:relative;z-index:2;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.4));}
  .cat-label{
    margin-top:-26px;
    position:relative; z-index:3;
    background:#000;
    color:#fff;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.5px;
    padding:6px 10px;
    border-radius:6px;
    display:inline-block;
  }
  .cat-badge{
    margin-top:8px;
    display:flex; flex-direction:column; align-items:center;
    border:1px solid var(--accent);
    border-radius:6px;
    padding:4px 8px;
    background:rgba(20,10,15,0.7);
  }
  .cat-badge .b-name{font-family:'Bebas Neue',sans-serif;font-size:13px;color:#fff;letter-spacing:0.5px;}
  .cat-badge .b-tag{font-family:'Bebas Neue',sans-serif;font-size:10px;color:var(--accent);letter-spacing:1px;}

  /* ---------- SECTIONS ---------- */
  section.block{padding:30px 20px 6px;}
  .block-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .block-head h2{
    font-family:'Bebas Neue',sans-serif;
    font-size:22px;
    letter-spacing:0.5px;
    color:#fff;
  }
  .clear-icon{width:19px;height:19px;color:var(--text-dim);cursor:pointer;}

  .row-scroll{
    display:flex;
    gap:14px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:4px;
  }
  .row-scroll::-webkit-scrollbar{display:none;}

  .poster-card{flex:0 0 auto; width:150px;}
  .poster-img{
    width:150px; height:210px;
    border-radius:10px;
    position:relative;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.5);
  }
  .poster-title{
    margin-top:8px;
    font-size:12.5px;
    font-weight:600;
    color:var(--text);
    line-height:1.35;
  }
  .badge-pill{
    position:absolute; top:8px; left:8px;
    background:rgba(0,0,0,0.75);
    color:#fff;
    font-size:10px;
    font-weight:700;
    padding:3px 8px;
    border-radius:5px;
    z-index:3;
  }

  /* generic placeholder illustration styling */
  .art{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .art svg{width:56%; height:56%;}

  /* bottom nav */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0;
    background:#0c0c13;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:10px 0 14px;
    z-index:20;
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--text-dim);
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.5px;
  }
  .nav-item svg{width:21px;height:21px;}
  .nav-item.active{color:var(--cyan);}
  .nav-item .dot{
    width:16px;height:2px;background:var(--cyan);border-radius:2px;margin-top:2px;
  }

  @media(min-width:720px){
    body{max-width:480px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border);}
  }
</style>
</head>
<body>

  <!-- HERO -->
  <div class="hero">
    <div class="topbar">
      <div class="brand">
        <span class="name">PRATIK</span>
        <span class="tag">ANIME STREAM</span>
        <span class="jp">アニメストリーム</span>
      </div>
      <div class="icon-group">
        <svg class="icon-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <svg class="icon-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <svg class="icon-btn" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </div>
    </div>

    <div class="hero-slash"></div>
    <div class="hero-slash right"></div>

    <div class="welcome-badge">WELCOME TO //</div>
    <div class="hero-title">
      <span class="l1">PRATIK</span>
      <span class="l2">ANIME STREAM</span>
    </div>
    <p class="hero-sub">Watch Anime Online in HD — Anytime, Anywhere</p>

    <div class="feature-row">
      <div class="feature-item">
        <div class="feature-icon"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg></div>
        <div class="feature-text"><div class="ft-title">HD QUALITY</div><div class="ft-sub">Best Anime in HD</div></div>
      </div>
      <div class="feature-item">
        <div class="feature-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg></div>
        <div class="feature-text"><div class="ft-title">DAILY UPDATES</div><div class="ft-sub">New Episodes Everyday</div></div>
      </div>
      <div class="feature-item">
        <div class="feature-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="13" rx="1"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></div>
        <div class="feature-text"><div class="ft-title">ANY DEVICE</div><div class="ft-sub">Watch on Any Device</div></div>
      </div>
    </div>

    <a href="#" class="cta-btn">
      <span class="cta-icon"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg></span>
      START WATCHING
    </a>

    <div class="hero-figures">
      <svg viewBox="0 0 500 560" preserveAspectRatio="xMidYMax meet">
        <defs>
          <linearGradient id="silo1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3a0d0d"/>
            <stop offset="100%" stop-color="#150404"/>
          </linearGradient>
        </defs>
        <!-- Generic action-pose silhouettes, entirely original shapes -->
        <g fill="url(#silo1)" opacity="0.95">
          <ellipse cx="250" cy="150" rx="55" ry="60"/>
          <path d="M170 220 Q250 180 330 220 L360 560 L140 560 Z"/>
        </g>
        <g fill="#0f0303" opacity="0.85">
          <ellipse cx="120" cy="230" rx="42" ry="46"/>
          <path d="M60 290 Q120 260 180 290 L200 560 L40 560 Z"/>
        </g>
        <g fill="#1a0606" opacity="0.85">
          <ellipse cx="390" cy="220" rx="42" ry="46"/>
          <path d="M330 280 Q390 250 450 280 L470 560 L310 560 Z"/>
        </g>
        <path d="M180 340 L220 300 L240 340 Z" fill="var(--accent2)" opacity="0.7"/>
      </svg>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <input type="text" placeholder="Search anime, movies, series...">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
    </div>

    <div class="categories" id="categories"></div>
  </div>

  <!-- WATCH HISTORY -->
  <section class="block">
    <div class="block-head">
      <h2>Watch History</h2>
      <svg class="clear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
    </div>
    <div class="row-scroll" id="history"></div>
  </section>

  <!-- NEWEST DROPS -->
  <section class="block">
    <div class="block-head">
      <h2>Newest Drops</h2>
    </div>
    <div class="row-scroll" id="drops"></div>
  </section>

  <!-- TRENDING -->
  <section class="block" style="padding-bottom:24px;">
    <div class="block-head">
      <h2>Trending Now</h2>
    </div>
    <div class="row-scroll" id="trending"></div>
  </section>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M7 6V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v2"/></svg>
      MOVIES
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      SERIES
    </a>
    <a class="nav-item active" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      HOME
      <span class="dot"></span>
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
      ANIME
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1z"/></svg>
      CARTOON
    </a>
  </nav>

<script>
// Original placeholder art (simple geometric/emoji-style icons) — NOT copyrighted character art.
// Replace the `art` field with your own poster image URLs later, e.g. art:'<img src="poster.jpg">'
const palette = [
  ['#ff5f6d','#2b0f13'],['#3ee6e6','#0e1f2b'],['#ffb347','#2b1c0f'],
  ['#a06bff','#1c122b'],['#4fd66c','#0f2b17'],['#ff4d8d','#2b0f1e'],
  ['#5b8cff','#0f1a2b'],['#f2c94c','#2b230f']
];

function gradientFor(i){
  const [c1,c2] = palette[i % palette.length];
  return `linear-gradient(150deg, ${c1}33 0%, ${c2} 70%)`;
}

function iconSVG(kind,color){
  const icons = {
    robot:`<path d="M9 2v3M15 2v3M6 8h12v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V8z" stroke="${color}" stroke-width="1.6" fill="none"/><circle cx="9.5" cy="13" r="1.2" fill="${color}"/><circle cx="14.5" cy="13" r="1.2" fill="${color}"/><path d="M9 17h6" stroke="${color}" stroke-width="1.6"/>`,
    kid:`<circle cx="12" cy="9" r="4" fill="${color}"/><path d="M6 21c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="${color}" stroke-width="1.6" fill="none"/>`,
    hero:`<circle cx="12" cy="7" r="3" fill="${color}"/><path d="M7 21l2-8h6l2 8" stroke="${color}" stroke-width="1.6" fill="none"/><path d="M9 13l-3-3M15 13l3-3" stroke="${color}" stroke-width="1.6"/>`,
    creature:`<ellipse cx="12" cy="13" rx="7" ry="6" fill="${color}"/><circle cx="9" cy="11" r="1.2" fill="#111"/><circle cx="15" cy="11" r="1.2" fill="#111"/><path d="M9 16q3 2 6 0" stroke="#111" stroke-width="1.3" fill="none"/>`,
    fight:`<path d="M4 12h6l2-3 2 3h6" stroke="${color}" stroke-width="1.8" fill="none"/><circle cx="12" cy="12" r="9" stroke="${color}" stroke-width="1.2" fill="none" opacity="0.4"/>`,
    magic:`<path d="M12 2l1.8 4.6L18 8l-4.2 1.4L12 14l-1.8-4.6L6 8l4.2-1.4z" fill="${color}"/><circle cx="18" cy="17" r="2" fill="${color}" opacity="0.8"/>`,
    forest:`<path d="M12 3l4 6H8z" fill="${color}"/><path d="M12 8l5 7H7z" fill="${color}"/><rect x="11" y="15" width="2" height="6" fill="${color}"/>`,
    ghost:`<path d="M6 20V11a6 6 0 0 1 12 0v9l-2-2-2 2-2-2-2 2-2-2z" fill="${color}"/><circle cx="9.5" cy="11" r="1" fill="#111"/><circle cx="14.5" cy="11" r="1" fill="#111"/>`
  };
  return icons[kind] || icons.hero;
}

function makePoster(title, iconKind, i, badge){
  const [c1] = palette[i % palette.length];
  return `
    <div class="poster-card">
      <div class="poster-img" style="background:${gradientFor(i)}">
        ${badge ? `<span class="badge-pill">${badge}</span>` : ''}
        <div class="art"><svg viewBox="0 0 24 24">${iconSVG(iconKind, c1)}</svg></div>
      </div>
      <div class="poster-title">${title}</div>
    </div>
  `;
}

// Categories row (top)
const categories = [
  {name:'ACTION', tag:'HEROES', icon:'hero', c:0},
  {name:'KIDS', tag:'FUNTIME', icon:'kid', c:2},
  {name:'SHONEN', tag:'BATTLE', icon:'fight', c:4},
];
document.getElementById('categories').innerHTML = categories.map((c,i)=>`
  <div class="cat-card">
    <div class="cat-poster" style="background:${gradientFor(c.c)}">
      <svg viewBox="0 0 24 24">${iconSVG(c.icon, palette[c.c][0])}</svg>
    </div>
    <div class="cat-label">${c.name}</div>
    <div class="cat-badge">
      <span class="b-name">ANIME</span>
      <span class="b-tag">STREAM</span>
    </div>
  </div>
`).join('');

// Watch History
const history = [
  {title:'Guardians of the Frozen Star', icon:'creature'},
  {title:'Blade Tournament Arc', icon:'fight'},
  {title:'Ranger Squad: Sea Temple', icon:'hero'},
  {title:'Secrets of the Jungle Trail', icon:'forest'},
];
document.getElementById('history').innerHTML = history.map((h,i)=>makePoster(h.title,h.icon,i)).join('');

// Newest Drops
const drops = [
  {title:'Reborn as a Slime King', icon:'magic', badge:'Season 4'},
  {title:'Handori-San Live', icon:'ghost'},
  {title:'Petal Bloom Girls', icon:'kid', badge:'Season 1'},
