<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pratik Anime Stream</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ HERO / HEADER ============ -->
<header class="hero">
  <div class="hero-overlay"></div>

  <nav class="topbar">
    <div class="brand">
      <span class="brand-main">PRATIK</span>
      <span class="brand-sub">ANIME STREAM</span>
      <span class="brand-jp">アニメストリーム</span>
    </div>
    <div class="topbar-icons">
      <button class="icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="icon-btn" aria-label="Bookmarks">
        <svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
      </button>
      <button class="icon-btn" aria-label="More options">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
    </div>
  </nav>

  <div class="hero-art" id="heroArt"></div>

  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Search" autocomplete="off">
    <button class="search-btn" aria-label="Run search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </div>
</header>

<!-- ============ FEATURED CATEGORY CARDS ============ -->
<section class="featured-row" id="featuredRow"></section>

<!-- ============ WATCH HISTORY ============ -->
<section class="rail-section">
  <div class="rail-heading">
    <h2>Watch History</h2>
    <button class="clear-btn" id="clearHistory" aria-label="Clear watch history">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
    </button>
  </div>
  <div class="rail" id="historyRail"></div>
</section>

<!-- ============ NEWEST DROPS ============ -->
<section class="rail-section">
  <div class="rail-heading">
    <h2>Newest Drops</h2>
  </div>
  <div class="rail" id="dropsRail"></div>
</section>

<div class="bottom-spacer"></div>

<!-- ============ BOTTOM NAV ============ -->
<nav class="bottom-nav">
  <button class="nav-item" data-tab="movies">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><line x1="7" y1="5" x2="7" y2="19"/><line x1="17" y1="5" x2="17" y2="19"/></svg>
    <span>Movies</span>
  </button>
  <button class="nav-item" data-tab="series">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><rect x="3" y="18" width="18" height="2" rx="1"/></svg>
    <span>Series</span>
  </button>
  <button class="nav-item active" data-tab="home">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    <span>Home</span>
  </button>
  <button class="nav-item" data-tab="anime">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 15s1.5 2 4 2 4-2 4-2"/></svg>
    <span>Anime</span>
  </button>
  <button class="nav-item" data-tab="cartoon">
    <svg viewBox="0 0 24 24"><path d="M12 2l2.5 5 5.5.8-4 3.9.9 5.3-4.9-2.6-4.9 2.6.9-5.3-4-3.9 5.5-.8z"/></svg>
    <span>Cartoon</span>
  </button>
</nav>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
